<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Tithi Galleries</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-form">
      <h1>Welcome back</h1>
      <p class="sub">Log in to your photographer dashboard.</p>
      <div id="out"></div>
      <div class="form-field"><label>Email / Username</label><input id="username" type="text" placeholder="you@example.com" /></div>
      <div class="form-field"><label>Password</label><input id="password" type="password" placeholder="Your password" /></div>
      <button class="btn btn-primary btn-lg auth-cta" id="login-btn">Log In</button>
      <p class="auth-link">New here? <a href="signup.html">Create a free account</a></p>
    </div>
  </div>
</body>
</html>
