<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Tithi Galleries (Free Trial)</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/app.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-form" id="auth-form" style="max-width:460px">
      <h1>Start your free trial</h1>
      <p class="sub">No credit card · 3 albums free · try it free</p>
      <div id="out"></div>
      <div class="form-field"><label>Email / Username</label><input id="username" type="text" placeholder="you@example.com" /></div>
      <div class="form-field"><label>Password</label><input id="password" type="password" placeholder="Create a password" /></div>
      <button class="btn btn-primary btn-lg auth-cta" id="register-btn">Create Free Account</button>
      <p class="auth-link">Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </div>
</body>
</html>
